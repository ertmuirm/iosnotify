name: IOSNotify
options:
  bundleIdPrefix: com.iosnotify
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  IOSNotify:
    type: application
    platform: iOS
    sources:
      - IOSNotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosnotify.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: IOSNotify/Info.plist
        CODE_SIGN_ENTITLEMENTS: IOSNotify/IOSNotify.entitlements
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: IOSNotify/IOSNotify.entitlements
